<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<meta name="description" content="RupeeRoo: a private, on-device budget tracker for Indian bank statements, with INR/AUD rates and a Sydney mode.">
<!-- Privacy by construction: the page may only talk to the exchange-rate APIs. Statements never leave the device. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; connect-src 'self' https://api.coinbase.com https://api.frankfurter.dev https://api.frankfurter.app https://open.er-api.com https://nominatim.openstreetmap.org; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>RupeeRoo – private money tracker</title>
<link rel="stylesheet" href="css/app.css">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div id="app" class="viz-root">
  <header class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true">🦘</span><span>RupeeRoo</span></div>
    <div class="topbar-right">
      <span id="fxPill" class="fx-pill" title="Exchange rate">…</span>
      <button class="icon-btn" data-action="open-settings" aria-label="Settings">⚙️</button>
    </div>
  </header>
  <div id="banner"></div>
  <main id="view" tabindex="-1"></main>
  <nav class="tabbar" aria-label="Sections">
    <button data-tab="home" class="active"><span>🏁</span>Home</button>
    <button data-tab="spend"><span>📊</span>Spend</button>
    <button data-tab="plan"><span>🔮</span>Plan</button>
    <button data-tab="fx"><span>💱</span>₹/A$</button>
    <button data-tab="sydney"><span>🇦🇺</span>Sydney</button>
  </nav>
  <div id="sheet" class="sheet" hidden><div class="sheet-backdrop" data-action="close-sheet"></div><div class="sheet-body" role="dialog" aria-modal="true"></div></div>
  <div id="tip" class="tip" hidden></div>
  <div id="toast" class="toast" hidden></div>
</div>
<input type="file" id="pdfInput" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="jsonInput" accept="application/json,.json" hidden>
<script type="module" src="js/app.js"></script>
</body>
</html>
