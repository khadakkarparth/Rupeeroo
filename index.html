<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<meta name="description" content="RupeeRoo: a private, on-device budget tracker for Indian bank statements, with INR/AUD rates and a Sydney mode.">
<!-- Privacy by construction: the page may only talk to the exchange-rate APIs. Statements never leave the device. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; worker-src 'self' blob:; connect-src 'self' https://api.coinbase.com https://api.frankfurter.dev https://api.frankfurter.app https://open.er-api.com https://nominatim.openstreetmap.org https://api.anthropic.com; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>RupeeRoo – private money tracker</title>
<link rel="stylesheet" href="css/app.css?v=20261114k">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div id="app" class="viz-root">
  <header class="topbar">
    <button class="brand" data-tab="home" aria-label="RupeeRoo, go to dashboard"><span class="logo" aria-hidden="true">R</span><span>RupeeRoo</span></button>
    <div class="topbar-right">
      <span id="fxPill" class="fx-pill" title="Exchange rate · open Currency" data-tab="fx" role="link" tabindex="0">…</span>
      <button class="icon-btn" data-action="open-settings" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>
  <div id="banner"></div>
  <main id="view" tabindex="-1"></main>
  <nav class="tabbar" aria-label="Sections">
    <button data-tab="home" class="active"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Home</button>
    <button data-tab="spend"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Spending</button>
    <button data-tab="plan"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>Plan</button>
    <button data-tab="fx"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>Currency</button>
    <button data-tab="sydney"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"/></svg>Sydney</button>
  </nav>
  <div id="sheet" class="sheet" hidden><div class="sheet-backdrop" data-action="close-sheet"></div><div class="sheet-body" role="dialog" aria-modal="true"></div></div>
  <div id="tip" class="tip" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <div id="achPop" class="ach-pop" role="status" aria-live="polite" hidden></div>
</div>
<input type="file" id="pdfInput" accept="application/pdf,.pdf" multiple hidden>
<input type="file" id="jsonInput" accept="application/json,.json" hidden>
<script type="module" src="js/app.js?v=20261114k"></script>
</body>
</html>
